# src/main/resources/application.properties
# Local bootstrap only - just enough to locate the Config Server. Everything else (datasource,
# Redis, JWT secret, Eureka registration, logging) is pulled per-profile from
# clickkart-config-repository.
spring.application.name=clickkart-user-service
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.cloud.config.uri=http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}
spring.cloud.config.username=${CONFIG_SERVER_USERNAME:admin}
spring.cloud.config.password=${CONFIG_SERVER_PASSWORD:dev-only-secret-change-me}
spring.cloud.config.fail-fast=true
# clickkart-config-repository is split into one branch per environment (dev/test/qa/prod), each
# holding only that environment's unsuffixed properties files - the git branch (label) IS the
# environment, not a filename suffix. Must track SPRING_PROFILES_ACTIVE exactly, or this service
# would activate one profile locally while pulling a DIFFERENT environment's config.
spring.cloud.config.label=${SPRING_PROFILES_ACTIVE:dev}
spring.config.import=configserver:

management.health.probes.enabled=true
management.info.env.enabled=true

# Fixed application behavior - caps a client-supplied ?size= on the admin browse endpoint so one
# query can't force the entire table into memory.
spring.data.web.pageable.max-page-size=100

info.service=clickkart-user-service
